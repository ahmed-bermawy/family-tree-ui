name: CI/CD - Frontend UI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy source via rsync (build happens on server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Source-only payload (~500KB): no node_modules, no dist, no .git
          for i in 1 2 3 4 5; do
            echo "--- rsync attempt $i/5 ---"
            if rsync -avz --delete \
              --exclude=node_modules --exclude=dist --exclude=.git \
              -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p ${{ secrets.PROD_PORT }}" \
              ./ "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:${{ secrets.PROD_UI_PATH }}"; then
              echo "rsync OK"
              exit 0
            fi
            echo "rsync failed, retrying in 10s..."
            sleep 10
          done
          echo "rsync failed after 5 attempts"
          exit 1

      - name: Build & restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_UI_PATH }}
            npm ci 2>&1 | tail -2
            npm run build 2>&1 | tail -3
            pm2 restart family-tree-ui-prod --update-env
