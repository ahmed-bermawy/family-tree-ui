name: CI/CD - Frontend UI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy source via rsync (build happens on server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Source-only payload (~500KB): no node_modules, no dist, no .git
          rsync -avz --delete \
            --exclude=node_modules --exclude=dist --exclude=.git \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p ${{ secrets.PROD_PORT }}" \
            ./ "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/home/production/family-tree-ui-build/"

      - name: Build & deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /home/production/family-tree-ui-build
            npm ci 2>&1 | tail -2
            npm run build 2>&1 | tail -3
            # Copy built assets into the served folder (PROD_UI_PATH = .../dist)
            rsync -a --delete /home/production/family-tree-ui-build/dist/ ${{ secrets.PROD_UI_PATH }}/
            command -v serve >/dev/null 2>&1 || npm install -g serve 2>&1 | tail -1
            pm2 restart family-tree-ui-prod --update-env || \
              pm2 start /usr/bin/serve --name family-tree-ui-prod -- -l 5173 -s ${{ secrets.PROD_UI_PATH }}
